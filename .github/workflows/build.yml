# Tests KUDUTUNES on every push: the parts that need no browser, then the real app in Chromium (listening to made-up
# tunes, playing, correcting, saving, recording with a pretend microphone). The app is installed on a server by hand
# (see INSTALL.md), so nothing is published from here.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tests that need no browser
        run: npm test
      - name: Get a browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Use the app in a browser
        run: npm run test:browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
