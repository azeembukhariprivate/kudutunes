# KUDUTUNES in a folder of a site nginx already serves, for example https://example.com/kudutunes/.
# Two parts, because nginx wants them in different places:
#   1. the map: outside every server { } block, at the top of the site's file in sites-available;
#   2. the location blocks: inside that site's existing https server { } block.
# Change "/kudutunes" (all of them) to the folder you want, and the path after "alias" to where the files are.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# All the add_header lines sit in the one location on purpose: an add_header in a location inside it would make
# that location drop the others, so the main page would lose its safety rules.

# ---- 1. outside the server block ----
map $uri $kudutunes_cache {
    default                "";          # an empty value sends no Cache-Control header
    /kudutunes/            "no-cache";
    /kudutunes/index.html  "no-cache";
    /kudutunes/sw.js       "no-cache";
}

# ---- 2. inside the site's https server block ----
location = /kudutunes { return 301 /kudutunes/; }

location ^~ /kudutunes/ {
    alias /var/www/kudutunes/;
    index index.html;

    types {
        text/html                 html;
        text/javascript           js mjs;
        application/json          json;
        application/manifest+json webmanifest;
        image/png                 png;
        image/svg+xml             svg;
        text/plain                txt;
        application/octet-stream  bin;
    }

    # The app keeps its own copy for working offline; these must always be fresh so new versions arrive.
    add_header Cache-Control $kudutunes_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Nothing here is for visitors.
    location ~ ^/kudutunes/(\.git|tests|tools|deploy|screenshots|node_modules)(/|$) { return 404; }
    location ~ ^/kudutunes/(package\.json|CLAUDE\.md|INSTALL\.md)$ { return 404; }
}
