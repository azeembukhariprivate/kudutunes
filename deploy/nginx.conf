# KUDUTUNES with nginx. Put this in /etc/nginx/sites-available/kudutunes, change the address (twice) and the folder
# if needed, link it into sites-enabled, then run certbot to add HTTPS (see INSTALL.md).
#
# Every add_header is at the server level on purpose. In nginx, an add_header inside a location block makes that
# location drop all the add_header lines from outside it, so the main page would lose its safety rules. Which files
# must always be fetched fresh is chosen with the map below instead.

map $uri $kudutunes_cache {
    default      "";          # an empty value sends no Cache-Control header
    /            "no-cache";
    /index.html  "no-cache";
    /sw.js       "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    root /var/www/kudunotes;
    index index.html;

    gzip on;
    gzip_types text/javascript application/javascript application/json text/css text/plain application/manifest+json;

    types {
        text/html                 html;
        text/javascript           js mjs;
        application/json          json;
        application/manifest+json webmanifest;
        image/png                 png;
        image/svg+xml             svg;
        text/plain                txt;
        application/octet-stream  bin;
    }

    # The app keeps its own copy for working offline; these must always be fresh so new versions arrive.
    add_header Cache-Control $kudutunes_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Nothing here is for visitors.
    location ~ ^/(\.git|tests|tools|deploy|screenshots|node_modules)(/|$) { return 404; }
    location ~ ^/(package\.json|CLAUDE\.md|INSTALL\.md)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
